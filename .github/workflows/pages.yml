name: Validate notes

# Publishing moved to Cloudflare Pages, which builds this repository itself and
# serves the write API alongside the site. This workflow is only the structural
# check — it must stay green, because a note committed from the phone lands on
# main without ever passing through anyone's laptop.

on:
  push:
    branches: [main]
    paths:
      - 'words/**'
      - 'templates/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'words/**'
      - 'templates/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate notes
        run: python scripts/vocab.py validate

      - name: Build site
        # Not deployed from here; this only proves the build still works.
        run: python scripts/build_site.py

      - name: Summary
        run: |
          {
            echo '```'
            python scripts/vocab.py stats
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
